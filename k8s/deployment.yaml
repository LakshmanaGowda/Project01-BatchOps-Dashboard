apiVersion: apps/v1
kind: Deployment
metadata:
  name: batchops-dashboard
  labels:
    app: batchops-dashboard

spec:
  replicas: 1

  selector:
    matchLabels:
      app: batchops-dashboard

  template:
    metadata:
      labels:
        app: batchops-dashboard

    spec:
      containers:
        - name: batchops-dashboard
          image: lakshmanagowda/batchops-dashboard:latest

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10